<div class="container">
    <h1>Movies</h1>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Genre</th>
          <th>Watched</th>
          <th>Rating</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let movie of movies">
          <td>{{ movie.ID }}</td>
          <td>{{ movie.Title }}</td>
          <td>{{ movie.Genre }}</td>
          <td>{{ movie.Watched ? 'Yes' : 'No' }}</td>
          <td>{{ movie.Rating }}</td>
          <td>
            <button (click)="deleteMovie(movie.ID)" class="btn btn-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
