<div class="container mt-5">
    <h2 class="mb-4 text-center">🎬 Movie Watchlist</h2>
  
    <form (ngSubmit)="addMovie()" class="border p-4 rounded bg-light">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <input
            [(ngModel)]="newMovie.title"
            name="title"
            class="form-control"
            placeholder="Title"
            required
          />
        </div>
        <div class="col-md-4">
          <input
            [(ngModel)]="newMovie.genre"
            name="genre"
            class="form-control"
            placeholder="Genre"
            required
          />
        </div>
        <div class="col-md-2">
          <input
            [(ngModel)]="newMovie.rating"
            name="rating"
            type="number"
            class="form-control"
            placeholder="Rating"
            min="0"
            max="10"
          />
        </div>
        <div class="col-md-2 d-flex align-items-center">
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              [(ngModel)]="newMovie.watched"
              name="watched"
              id="watched"
            />
            <label class="form-check-label" for="watched">Watched</label>
          </div>
        </div>
      </div>
      <div class="text-end">
        <button type="submit" class="btn btn-primary">Add Movie</button>
      </div>
    </form>
  

    <div class="mt-5">
      <h4 class="mb-3">Your Movies</h4>
      <ul class="list-group">
        <li
          *ngFor="let movie of movies"
          class="list-group-item d-flex justify-content-between align-items-center"
        >
          <div>
            <strong>{{ movie.title }}</strong> ({{ movie.genre }})<br />
            Rating: {{ movie.rating }} | Watched:
            <span [ngClass]="movie.watched ? 'text-success' : 'text-muted'">
              {{ movie.watched ? 'Yes' : 'No' }}
            </span>
          </div>
          <button class="btn btn-danger btn-sm" (click)="deleteMovie(movie.id)">
            Delete
          </button>
        </li>
      </ul>
    </div>
  </div>
